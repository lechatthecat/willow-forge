[package]
name = "willow-forge-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
axum = "0.8.9"
tokio = { version = "1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
validator = { version = "0.20.0", features = ["derive"] }
anyhow = "1"
thiserror = "1"
minijinja = { version = "2", features = ["loader"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "chrono"] }
redis = { version = "1.2.0", features = ["tokio-comp", "cluster-async"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
argon2 = "0.5"
uuid = { version = "1", features = ["v4"] }
cookie = "0.18"
jsonwebtoken = "9"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder", "hostname"] }
sha2 = "0.10"
hmac = "0.12"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tower = { version = "0.5.3", features = ["util"] }
